trigger:
  branches:
    include:
      - main

pool: Default

# pr:
#   branches:
#     include:
#       - main
#       - develop
#       - release/*


variables:

  pythonVersion: '3.11'

  artifactName: 'python-app'

  appName: 'python-app'

  stagingEnvironment: 'python-staging'

  productionEnvironment: 'python-production'

  azureServiceConnection: 'Azure-Production-ServiceConnection'

  keyVaultName: 'python-production-kv'


# ============================================================
# CI
# ============================================================

stages:

# ------------------------------------------------------------
# PR / QUALITY
# ------------------------------------------------------------

- stage: PR_Quality
  displayName: 'PR Quality and Security'

  condition: eq(variables['Build.Reason'], 'PullRequest')

  jobs:

  - job: Quality
    displayName: 'Python Quality Checks'


    steps:

    - checkout: self
      clean: true


    - task: UsePythonVersion@0
      displayName: 'Install Python'
      inputs:
        versionSpec: '$(pythonVersion)'


    - script: |
        python -m pip install --upgrade pip

        pip install \
          -r requirements.txt \
          -r requirements-dev.txt
      displayName: 'Install dependencies'


    # --------------------------------------------------------
    # LINT
    # --------------------------------------------------------

    - script: |
        ruff check .
      displayName: 'Ruff Lint'


