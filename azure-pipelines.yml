trigger:
  branches:
    include:
      - main

pool: Default


variables:

  pythonVersion: '3.11'

  artifactName: 'python-app'

  appName: 'python-app'

  stagingEnvironment: 'python-staging'

  productionEnvironment: 'python-production'

  keyVaultName: 'python-production-kv'


# ============================================================
# STAGE 1 - BUILD
# ============================================================

stages:

- stage: Build

  displayName: 'Build Python Application'

  jobs:

  - job: Build

    displayName: 'Build, Test and Package'

    steps:

    # --------------------------------------------------------
    # CHECKOUT
    # --------------------------------------------------------

    - checkout: self

      clean: true


    # --------------------------------------------------------
    # PYTHON
    # --------------------------------------------------------
    - task: CmdLine@2
      inputs:
            script: |
                  set -e
              
                  sudo apt update
              
                  sudo apt install -y \
                    python3 \
                    python3-pip \
                    python3-venv
              
                  python3 --version
              
                  python3 -m pip --version
    # --------------------------------------------------------
    # INSTALL DEPENDENCIES
    # --------------------------------------------------------
    - task: CmdLine@2
      inputs:
        script: |
          - script: |
          
              set -e
          
              python -m pip install --upgrade pip
          
              python -m pip install -r requirements.txt
          
              python -m pip install -r requirements-dev.txt
          
            displayName: 'Install Python Dependencies'

